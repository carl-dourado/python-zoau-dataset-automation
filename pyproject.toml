[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mainframe-dataset-automation"
version = "0.2.0"
description = "Python automation for TK5/MVS IEBCOPY PDS member copy demos."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Carlos Dourado" }]
license = { text = "MIT" }
keywords = ["ibm-z", "mvs", "tk5", "hercules", "jcl", "iebcopy", "datasets"]

[project.scripts]
mainframe-dataset = "mainframe_dataset_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
